<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vehicle turntable</title>
    <style>
      html, body { margin: 0; background: #0b0b0d; }
      #sheet { width: 1920px; background: #121318; color: #e8e4dc; font: 15px/1.3 ui-sans-serif, system-ui, sans-serif; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 14px 8px; }
      header strong { font-size: 18px; letter-spacing: 0.02em; }
      #frame { position: relative; width: 1920px; height: 540px; }
      canvas { display: block; width: 1920px; height: 540px; }
      #labels {
        position: absolute; inset: 0; display: grid;
        grid-template-columns: repeat(4, 480px); grid-template-rows: repeat(2, 270px);
        pointer-events: none;
      }
      #labels div { display: flex; align-items: flex-end; padding: 8px; }
      #labels span { background: rgba(0, 0, 0, 0.62); padding: 2px 7px; border-radius: 2px; }
    </style>
  </head>
  <body>
    <div id="sheet">
      <header>
        <strong id="title">vehicle</strong>
        <span id="dims"></span>
      </header>
      <div id="frame">
        <canvas id="view" width="1920" height="540"></canvas>
        <div id="labels"></div>
      </div>
    </div>
    <script type="module" src="./vehicle-turntable.ts"></script>
  </body>
</html>
