<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#050507" />
    <meta name="description" content="A fan-made browser tribute to the Los Angeles of Blade Runner 2049 — fly a spinner, walk the rain-soaked streets, or watch the city on its own." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Neon LA 2049</title>
  </head>
  <body>
    <canvas id="view" tabindex="0"></canvas>
    <div class="loading" id="loading" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Loading Los Angeles">
      <div class="loading-card">
        <p class="loading-kicker">Neon LA 2049</p>
        <p class="loading-label" data-load-label>Start</p>
        <div class="loading-track"><div class="loading-bar" data-load-bar></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
